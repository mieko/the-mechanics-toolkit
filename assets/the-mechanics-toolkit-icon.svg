<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">The Mechanic's Toolkit</title>
  <desc id="desc">A precision extraction rig opens a lit path through a dark machine room.</desc>
  <defs>
    <linearGradient id="shell" x1="154" y1="86" x2="856" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b353b"/>
      <stop offset="0.46" stop-color="#172126"/>
      <stop offset="1" stop-color="#0b1013"/>
    </linearGradient>
    <linearGradient id="well" x1="512" y1="246" x2="512" y2="859" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090d0f"/>
      <stop offset="1" stop-color="#151d21"/>
    </linearGradient>
    <linearGradient id="steel" x1="300" y1="250" x2="722" y2="775" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7e1e5"/>
      <stop offset="0.38" stop-color="#8ea3ad"/>
      <stop offset="1" stop-color="#526873"/>
    </linearGradient>
    <linearGradient id="litSteel" x1="392" y1="290" x2="596" y2="794" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1f7f5"/>
      <stop offset="0.7" stop-color="#a8c8ca"/>
      <stop offset="1" stop-color="#63858e"/>
    </linearGradient>
    <radialGradient id="signal" cx="0" cy="0" r="1" gradientTransform="translate(512 727) rotate(-90) scale(188)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8a46" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#f36d2f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f36d2f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shellShadow" x="10" y="18" width="1004" height="1012" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <filter id="orangeGlow" x="354" y="570" width="316" height="322" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <g filter="url(#shellShadow)">
    <rect x="58" y="44" width="908" height="908" rx="210" fill="url(#shell)"/>
    <rect x="69" y="55" width="886" height="886" rx="199" fill="none" stroke="#788a92" stroke-opacity="0.34" stroke-width="6"/>
    <path d="M113 741V255c0-88 70-158 158-158h486c88 0 158 70 158 158v486c0 88-70 158-158 158H271c-88 0-158-70-158-158Z" fill="none" stroke="#040607" stroke-opacity="0.56" stroke-width="5"/>
  </g>

  <!-- The machine room: an inset service well, not a decorative gear. -->
  <rect x="173" y="174" width="678" height="678" rx="164" fill="url(#well)" stroke="#4a5c64" stroke-width="5"/>
  <path d="M219 303H805M219 721H805" stroke="#a8bac1" stroke-opacity="0.12" stroke-width="4"/>
  <path d="M250 239 774 787M774 239 250 787" stroke="#9eb1b9" stroke-opacity="0.045" stroke-width="9"/>
  <circle cx="512" cy="700" r="218" fill="url(#signal)"/>

  <!-- The puller: The Mechanic's office mark translated into a small-screen glyph. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 323H734" stroke="#1b252a" stroke-width="66"/>
    <path d="M290 307H734" stroke="url(#steel)" stroke-width="52"/>
    <path d="M329 330 372 699h74" stroke="#11181b" stroke-width="58"/>
    <path d="M695 330 652 699h-74" stroke="#11181b" stroke-width="58"/>
    <path d="M329 319 372 687h74" stroke="url(#steel)" stroke-width="40"/>
    <path d="M695 319 652 687h-74" stroke="url(#steel)" stroke-width="40"/>
    <path d="M512 242V690" stroke="#182226" stroke-width="66"/>
    <path d="M512 230V678" stroke="url(#litSteel)" stroke-width="44"/>
    <path d="M443 228H581" stroke="#11181b" stroke-width="66"/>
    <path d="M443 216H581" stroke="url(#steel)" stroke-width="48"/>
  </g>

  <!-- The seized race and the one warm point where the intervention is applied. -->
  <circle cx="512" cy="698" r="123" fill="#0a0e10" stroke="#141d21" stroke-width="50"/>
  <circle cx="512" cy="686" r="123" fill="none" stroke="url(#steel)" stroke-width="38"/>
  <circle cx="512" cy="686" r="76" fill="#11181b" stroke="#3e5058" stroke-width="8"/>
  <circle cx="512" cy="686" r="58" fill="#070a0c"/>
  <circle cx="512" cy="686" r="47" fill="#f36d2f" opacity="0.25" filter="url(#orangeGlow)"/>
  <path d="m512 628 51 30v58l-51 30-51-30v-58Z" fill="#f26b32" stroke="#ffb07e" stroke-width="8" stroke-linejoin="round"/>
  <path d="M512 644v84" stroke="#7d2d12" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round"/>

  <!-- A narrow opening above the spindle: the escape path after the obstruction moves. -->
  <path d="M512 114v82" stroke="#d8eef0" stroke-opacity="0.18" stroke-width="18" stroke-linecap="round"/>
  <path d="M512 124v72" stroke="#bce7e8" stroke-width="8" stroke-linecap="round"/>
</svg>
